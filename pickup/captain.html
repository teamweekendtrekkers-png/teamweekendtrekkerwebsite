<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Manage pickup lists | Team Weekend Trekkers</title>
  <link rel="stylesheet" href="pickup.css">
  <script src="api.js?v=2026112602" defer></script>
  <script src="../js/trips-data.js" defer></script>
  <script src="../js/trip-date-utils.js" defer></script>
  <script src="../js/trip-detail-lists.js" defer></script>
  <script src="reuse.js" defer></script>
  <script src="captain.js?v=2026112604" defer></script>
</head>
<body><main>
  <h1>Manage pickup lists</h1>
  <p id="notice" role="status"></p>
  <form id="signin" hidden>
    <label for="email">Organizer email</label><input id="email" type="email" required autocomplete="username">
    <label for="password">Password</label><input id="password" type="password" required autocomplete="current-password">
    <button>Sign in</button>
  </form>
  <div id="dashboard" hidden>
    <button id="signOut" type="button">Sign out</button>
    <label for="week">Show departures</label><select id="week">
      <option value="0">This week</option>
      <option value="1">Next week</option>
      <option value="all">All departures</option>
    </select>
    <label for="departure">Departure</label><select id="departure"></select>
    <h2 id="departureTitle" hidden></h2>
    <button id="refresh" type="button">Refresh list</button>
    <a id="publicLink" href="./">Open departure page</a>
    <button id="copyDeparture" type="button">Copy shared check-in link</button>
    <details id="listAccess"><summary>Give a captain access</summary>
      <p>Generate credentials for this departure only. Generating a new set replaces the previous set.</p>
      <button id="generate" type="button">Generate username and password</button>
      <div id="generated" hidden>
        <p id="credentials"></p>
        <button id="copyAccess" type="button">Copy access details</button>
      </div>
    </details>
    <details><summary>Set up a departure</summary>
      <form id="setup">
        <label for="title">Trip name</label><input id="title" required maxlength="100">
        <label for="date">Departure date</label><input id="date" required type="date">
        <label for="carry">Things to carry, one per line</label><textarea id="carry" rows="3"></textarea>
        <button>Create departure page</button>
      </form>
    </details>
    <details id="reuseSettings"><summary>Reuse website pickup points and packing items</summary>
      <label for="reuseTrip">Copy from a website trip</label><select id="reuseTrip"></select>
      <h3>Pickup points</h3><ul id="reuseStops"></ul>
      <button id="saveReuseStops" type="button">Add selected pickup points</button>
      <h3>Things to carry</h3><ul id="reusePacking"></ul>
      <button id="saveReusePacking" type="button">Save selected packing list</button>
    </details>
    <details id="stopSettings"><summary>Update pickup points</summary>
      <form id="stopForm">
        <label for="stopChoice">Pickup stop</label><select id="stopChoice"></select>
        <label for="stopName">Stop name</label><input id="stopName" required maxlength="120">
        <label for="stopTime">Pickup time</label><input id="stopTime" required maxlength="80">
        <label for="landmark">Landmark</label><input id="landmark" maxlength="160">
        <label for="mapUrl">Map link</label><input id="mapUrl" type="url" maxlength="400">
        <button>Save pickup point</button>
      </form>
    </details>
    <div id="checkins"></div>
  </div>
</main></body></html>
