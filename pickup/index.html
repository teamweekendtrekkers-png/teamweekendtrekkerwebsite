<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Trip check-in | Team Weekend Trekkers</title>
  <link rel="stylesheet" href="../css/travel-planner.css?v=2026112603">
  <link rel="stylesheet" href="pickup.css?v=2026112612">
  <script src="api.js" defer></script>
  <script src="../js/packing-checklist.js?v=2026112603" defer></script>
  <script src="pickup.js?v=2026112612" defer></script>
</head>
<body><main class="traveller-departure">
  <a href="../trips.html">← All trips</a>
  <header class="departure-header">
    <div>
      <h1 id="trip">Trip check-in</h1>
      <time id="travelDate" hidden></time>
    </div>
    <button id="share" type="button" hidden>Copy departure link</button>
  </header>
  <p id="notice" role="status"></p>
  <div id="departure" hidden>

    <details open><summary>Pickup points</summary><ul id="stops"></ul></details>
    <details id="packingSection">
      <summary>Things to carry <span class="packing-summary-hint">Open the checklist and tick items as you pack.</span></summary>
      <div id="thingsToCarryGrid" class="carry-grid"></div>
    </details>
    <section class="departure-checkin"><h2>Check in</h2>
      <form id="checkin" hidden>
        <label for="name">Lead traveller name</label><input id="name" required maxlength="100" autocomplete="name">
        <label for="phone">Phone number</label><input id="phone" type="tel" required maxlength="22" autocomplete="tel">
        <label for="people">Total travellers, including you</label><input id="people" type="number" min="1" max="50" required value="1">
        <fieldset id="passengers" hidden>
          <legend>Additional travellers</legend>
          <div id="passengerFields"></div>
        </fieldset>
        <label for="stop">Pickup point</label><select id="stop" required></select>
        <button>Save check-in</button>
      </form>
      <div id="checkinComplete" class="checkin-complete" hidden>
        <h3 tabindex="-1" id="checkinCompleteTitle">Check-in complete</h3>
        <p id="checkinDetails"></p>
        <div class="checkin-next-actions">
          <a id="checkinTripDetails" href="/trips.html">Browse trips on our website</a>
          <button id="editCheckin" type="button">Edit check-in</button>
        </div>
      </div>
      <p id="confirmation" role="status"></p>
    </section>
  </div>
</main></body></html>
