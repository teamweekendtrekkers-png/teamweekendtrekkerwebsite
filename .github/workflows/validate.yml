name: Validate and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Production deployments stay serial. Each pull request validates independently; superseded PR checks can stop.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analytics-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: analytics_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: analytics_test
    steps:
      - uses: actions/checkout@v4
      - name: Test analytics grants and ordered cohorts
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/journey-db-fixture.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261021_journey_analytics.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261118181652_journey_report_indexed_funnel.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261124143000_journey_insights.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261125120000_departure_booking_queue.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/journey-db.test.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/journey-report-volume.test.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261126120000_pickup_manifest.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/pickup-manifest.test.sql

  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Check production pages, source syntax and linked assets
      run: node scripts/validate-source.cjs

  javascript-validation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install image pipeline dependencies
      run: npm install --no-audit --no-fund --package-lock=false

    - name: Test website behaviour
      run: node --test tests/*.test.js

    - name: Install checkout test browser
      run: npx playwright install --with-deps chromium

    - name: Test customer checkout and gallery
      env:
        PAYMENT_REVIEW_DIR: ${{ github.workspace }}/build/payment-reviews
      run: |
        npm run test:payment
        npm run test:checkout
        node scripts/check-trip-brochure-browser.cjs
        node scripts/check-travel-planner-browser.cjs
        node scripts/check-catalogue-filters-browser.cjs
        node scripts/check-editor-presentation-browser.cjs
        node scripts/check-journey-analytics-browser.cjs
        node scripts/check-site-motion-browser.cjs
        node scripts/check-gallery-layout-browser.cjs
        node scripts/check-destination-slider-browser.cjs

    - name: Save homepage layout screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: homepage-layout-review
        path: build/layout-review/*.png
        if-no-files-found: warn

    - name: Save catalogue filter review screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: catalogue-filter-review
        path: build/search-review/*.png
        if-no-files-found: warn

    - name: Save brochure review pages
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: brochure-review
        path: build/brochure-review/
        if-no-files-found: warn

    - name: Save checkout review screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: checkout-review
        path: build/payment-reviews/*.png
        if-no-files-found: warn

  security-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Security Checks
      run: |
        echo "🔐 Running security checks..."
        
        # Check for exposed API keys (pattern matching)
        if grep -rE "(api_key|apikey|API_KEY|secret_key|SECRET_KEY|password|PASSWORD).*=.*['\"][^'\"]{10,}['\"]" js/*.js 2>/dev/null; then
          echo "⚠️ Potential exposed secrets found - review above matches"
        else
          echo "✅ No obvious exposed secrets"
        fi
        
        # Check for inline scripts with sensitive data
        if grep -l "rzp_live_\|rzp_test_" *.html 2>/dev/null; then
          echo "⚠️ Razorpay keys found in HTML - ensure they are public keys only"
        fi
        
        # Check security.js exists
        if [ -f "js/security.js" ]; then
          echo "✅ security.js exists"
        else
          echo "⚠️ security.js not found"
        fi
        
        echo "✅ Security check completed"

  test-summary:
    needs: [validate, javascript-validation, analytics-database, security-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Require every current check to pass
      env:
        JOB_RESULTS: ${{ toJSON(needs) }}
      run: |
        node -e 'const jobs=JSON.parse(process.env.JOB_RESULTS); for(const [name,job] of Object.entries(jobs)) console.log(name+": "+job.result); if(Object.values(jobs).some(job=>job.result!=="success")) process.exit(1);'

  deploy:
    needs: [test-summary]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Install image optimiser
      run: npm install --no-audit --no-fund --package-lock=false

    - name: Restore responsive photo cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/responsive-photos
        key: responsive-photos-v1-${{ hashFiles('scripts/optimize-images.js', 'package.json') }}-${{ github.sha }}-${{ github.run_attempt }}
        restore-keys: responsive-photos-v1-${{ hashFiles('scripts/optimize-images.js', 'package.json') }}-

    - name: Generate responsive WebP and AVIF photos
      env:
        OPTIMIZED_IMAGE_CACHE: ${{ runner.temp }}/responsive-photos
      run: npm run optimize-images

    - name: Prepare selected homepage cover and settings
      run: node scripts/prepare-homepage.js

    - name: Generate crawler-readable trip pages
      run: node scripts/generate-trip-pages.js

    - name: Generate authoritative booking catalogue
      run: node scripts/build-booking-catalog.cjs
    
    - name: Remove build dependencies from the Pages artifact
      run: node -e "require('node:fs').rmSync('node_modules', {recursive:true, force:true})"

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'
        name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Deploy uploaded artifact to GitHub Pages
      id: deployment
      uses: actions/github-script@v7
      env:
        PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      with:
        script: |
          const repo = context.repo;
          const name = process.env.PAGES_ARTIFACT;
          const pause = () => new Promise(resolve => setTimeout(resolve, 5000));
          let artifact;
          for (let attempt = 0; attempt < 12 && !artifact; attempt++) {
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              ...repo, run_id: context.runId, name
            });
            artifact = data.artifacts.find(item => item.name === name && !item.expired);
            if (!artifact) await pause();
          }
          if (!artifact) throw new Error('The uploaded Pages artifact did not become visible.');

          const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
            ...repo,
            artifact_id: artifact.id,
            pages_build_version: context.sha,
            oidc_token: await core.getIDToken()
          });
          const statusRoute = 'GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}';
          const deployment_id = deployment.id || deployment.status_url?.split('/').pop() || context.sha;
          for (let attempt = 0; attempt < 120; attempt++) {
            await pause();
            const { data } = await github.request(statusRoute, { ...repo, deployment_id });
            if (data.status === 'succeed') {
              core.setOutput('page_url', deployment.page_url);
              return;
            }
            if (['deployment_failed', 'deployment_cancelled', 'artifact_failed', 'artifact_not_found',
                 'artifact_too_large', 'purge_failed'].includes(data.status)) {
              throw new Error(`GitHub Pages deployment reported ${data.status}.`);
            }
          }
          throw new Error('Timed out waiting for GitHub Pages to publish.');

    - name: Deployment Summary
      run: |
        echo ""
        echo "================================================"
        echo "🚀 Website deployed successfully!"
        echo "📍 URL: ${{ steps.deployment.outputs.page_url }}"
        echo "================================================"
